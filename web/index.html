<title>Lexi Reader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/literata-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">

<div id="app" class="app">
  <main id="tab-root" class="tab-root" aria-live="polite">
    <div class="boot">Loading library…</div>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a class="tab" href="#library" data-tab="library">
      <svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="4.5" width="4.5" height="17" rx="1"/><rect x="9.5" y="7" width="4.5" height="14.5" rx="1"/><rect x="16.2" y="5.5" width="4.5" height="16" rx="1" transform="rotate(-13 18.45 13.5)"/><path d="M2.5 23h21" stroke-linecap="round"/></svg>
      <span>Library</span>
    </a>
    <a class="tab" href="#vocabulary" data-tab="vocabulary">
      <svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M5.5 5.5A2 2 0 0 1 7.5 3.5h13v16h-13a2 2 0 0 0-2 2z"/><path d="M5.5 21.5a2 2 0 0 0 2 2h13v-4"/><path d="M10.5 15l2.5-7 2.5 7M11.4 12.6h3.2"/></svg>
      <span>Vocabulary</span>
    </a>
    <a class="tab" href="#flashcards" data-tab="flashcards">
      <svg viewBox="0 0 26 26" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="8.5" width="15" height="13" rx="2.5"/><path d="M7.5 5h12a3 3 0 0 1 3 3v9.5"/></svg>
      <span>Flashcards</span>
      <b class="badge" id="due-badge" hidden></b>
    </a>
  </nav>
</div>

<div id="reader-root"></div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="js/app.js"></script>
